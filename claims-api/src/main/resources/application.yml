spring:
  application:
    name: claims-api

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:claims}
    username: ${DB_USERNAME:claims}
    password: ${DB_PASSWORD:claims}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        default_schema: public
    open-in-view: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    validate-on-migrate: true

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: claims-api-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 5000

  task:
    scheduling:
      pool:
        size: 2

server:
  port: ${APP_PORT:8080}
  address: ${APP_HOST:0.0.0.0}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized

logging:
  level:
    root: INFO
    com.msig.claimsapi: DEBUG
    org.hibernate.SQL: WARN
    org.hibernate.type.descriptor.sql.BasicBinder: WARN

claims:
  processing:
    default-mode: AI_ASSISTED
    stp-confidence-threshold: 85
    hitl-confidence-threshold: 60
    ai-enabled: true
    circuit-breaker:
      failure-threshold: 3
      reset-minutes: 2
  azure:
    ai:
      enabled: false
      project-endpoint: ${AZURE_AI_PROJECT_ENDPOINT:}
      api-key: ${AZURE_AI_API_KEY:}
      model-deployment: ${AZURE_OPENAI_DEPLOYMENT:gpt-4o}
      api-version: ${AZURE_OPENAI_API_VERSION:2024-06-01}
      api-path: ${AZURE_OPENAI_API_PATH:deployments}
      vision:
        endpoint: ${AZURE_VISION_ENDPOINT:}
        api-key: ${AZURE_VISION_API_KEY:}
        api-version: ${AZURE_VISION_API_VERSION:2024-05-01-preview}
      search:
        endpoint: ${AZURE_SEARCH_ENDPOINT:}
        api-key: ${AZURE_SEARCH_API_KEY:}
        index: ${AZURE_SEARCH_INDEX:claims}
      max-retries: 3
      timeout-seconds: 30

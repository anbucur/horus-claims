spring:
  application:
    name: claims-api

  datasource:
    url: jdbc:postgresql://postgres:5432/${DB_NAME:claims}
    username: ${DB_USERNAME:claims}
    password: ${DB_PASSWORD:claims}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 10
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        default_schema: public
        autocommit: false
        packages:
          scan:
            - com.msig.claimsdomain.entities
            - com.msig.claimsdomain.model
    open-in-view: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    validate-on-migrate: true

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:kafka:9092}
    consumer:
      group-id: claims-api-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

  data:
    redis:
      host: ${REDIS_HOST:valkey}
      port: 6379
      password: ${REDIS_PASSWORD:valkey_secure_pass}
      timeout: 5000

claims:
  azure:
    ai:
      enabled: false
  processing:
    ai-enabled: false

server:
  port: ${APP_PORT:8080}
  address: ${APP_HOST:0.0.0.0}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized

logging:
  level:
    root: INFO
    com.msig.claimsapi: DEBUG
    org.hibernate.SQL: WARN
    org.hibernate.type.descriptor.sql.BasicBinder: WARN
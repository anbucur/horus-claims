version: '3.9'

services:
  ingest:
    image: claims-ingest:latest
    container_name: claims-ingest
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      DATABASE_URL: postgresql://claims_user:claims_secure_pass@postgres:5432/claims
      VALKEY_HOST: valkey
      VALKEY_PASSWORD: valkey_secure_pass
    ports:
      - "8000:8000"
    networks:
      - claims-network
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped
version: '3.9'

networks:
  claims-network:
    driver: bridge

volumes:
  postgres_data:
  kafka_data:
  valkey_data:

services:
  postgres:
    image: postgres:16-alpine
    container_name: claims-postgres
    environment:
      POSTGRES_DB: claims
      POSTGRES_USER: claims_user
      POSTGRES_PASSWORD: ${DB_PASSWORD:-claims_secure_pass}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./claims-docker/postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"
    networks:
      - claims-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U claims_user -d claims"]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka:
    image: bitnami/kafka:3.7
    container_name: claims-kafka
    environment:
      KAFKA_CFG_NODE_ID: 0
      KAFKA_CFG_PROCESS_ROLES: controller,broker
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 0@kafka:9093
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      BITNAMI_DEBUG: "yes"
    volumes:
      - kafka_data:/bitnami/kafka
    networks:
      - claims-network
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 30s
      timeout: 10s
      retries: 5

  valkey:
    image: bitnami/valkey:8.0
    container_name: claims-valkey
    environment:
      VALKEY_PASSWORD: ${VALKEY_PASSWORD:-valkey_secure_pass}
    volumes:
      - valkey_data:/data
    ports:
      - "6379:6379"
    networks:
      - claims-network
    healthcheck:
      test: ["CMD-SHELL", "valkey-cli ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    container_name: claims-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - claims-network
    healthcheck:
      test: ["CMD-SHELL", "echo ruok | nc localhost 2181 | grep imok"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: claims-api/Dockerfile
    container_name: claims-api
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES:-docker}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: claims
      DB_USER: claims_user
      DB_PASSWORD: ${DB_PASSWORD:-claims_secure_pass}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      VALKEY_HOST: valkey
      VALKEY_PASSWORD: ${VALKEY_PASSWORD:-valkey_secure_pass}
    ports:
      - "8080:8080"
    networks:
      - claims-network
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      valkey:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5

  ingest:
    build:
      context: .
      dockerfile: claims-ingest/Dockerfile
    container_name: claims-ingest
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: claims
      POSTGRES_USER: claims_user
      POSTGRES_PASSWORD: ${DB_PASSWORD:-claims_secure_pass}
      VALKEY_HOST: valkey
      VALKEY_PASSWORD: ${VALKEY_PASSWORD:-valkey_secure_pass}
    networks:
      - claims-network
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: claims-frontend/Dockerfile
    container_name: claims-frontend
    ports:
      - "3000:80"
    networks:
      - claims-network
    depends_on:
      - api

  nginx:
    image: nginx:alpine
    container_name: claims-nginx
    volumes:
      - ./claims-docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./claims-docker/nginx/conf.d:/etc/nginx/conf.d:ro
    ports:
      - "80:80"
    networks:
      - claims-network
    depends_on:
      - api
      - frontend

name: CI Build & Test

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build with Maven
        run: mvn clean compile -pl claims-domain,claims-api

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run tests
        run: mvn test -pl claims-domain,claims-api

  docker-build-and-push:
    name: Docker Build & Push
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push claims-api
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./claims-api/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: horus/claims-api:latest,horus/claims-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push claims-frontend
        uses: docker/build-push-action@v5
        with:
          context: ./claims-frontend
          file: ./claims-frontend/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: horus/claims-frontend:latest,horus/claims-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
